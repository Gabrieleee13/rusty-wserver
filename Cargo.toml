[package]
name = "rusty-wserver"
version = "0.1.0"
edition = "2024"

[dependencies]
threadpool = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
validator = { version = "0.18", features = ["derive"] }
roxmltree = "0.20"
lasso = { version = "0.7", features = ["multi-threaded"] }
once_cell = "1.21"